<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --oro:#FFC800; --crema:#F2EDE3; --gris:#9AA3B2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: transparent; color: var(--crema); font-family: 'Inter','Segoe UI',sans-serif; }
.wrap { display: flex; gap: 28px; align-items: center; height: 100%; padding: 4px; }
.izq { flex: 0 0 min(46%, 560px); display: grid; place-items: center; }
.izq svg { width: 100%; height: auto; max-height: 600px; overflow: visible; }
.der { flex: 1; min-width: 0; padding: 26px 30px; border: 1px solid rgba(255,200,0,.22); border-radius: 18px;
       background: linear-gradient(160deg,#171C26 0%,#0F131A 100%); position: relative; overflow: hidden; }
.der::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
       background: linear-gradient(90deg, transparent, var(--oro), transparent); }
.kick { color: var(--oro); letter-spacing: .32em; text-transform: uppercase; font-size: .72rem; font-weight: 700; }
.titulo { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(28px, 3.1vw, 44px); line-height: 1.05; margin: .35rem 0 .7rem; }
.pill { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .74rem; font-weight: 600; letter-spacing: .04em; }
.ok { background: #14532D; color: #86EFAC; } .no { background: #4C1D1D; color: #FCA5A5; }
.fila { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.fila small { color: var(--gris); text-transform: uppercase; letter-spacing: .16em; font-size: .68rem; padding-top: 3px; }
.fila span { font-size: .96rem; line-height: 1.4; }
.res { display: flex; align-items: baseline; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
.num { font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(30px, 3vw, 44px); line-height: 1; }
.asis { color: #E5484D; } .tobe { color: var(--oro); }
.flecha { color: var(--gris); font-size: 1.4rem; }
.meta { color: var(--gris); font-size: .8rem; margin-left: auto; }
.etq { color: var(--gris); letter-spacing: .2em; font-size: .64rem; margin-top: 4px; }
.anim { animation: entra .55s ease-out both; }
@keyframes entra { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.dial { transform-origin: 260px 260px; transform-box: view-box; animation: gira 180s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.arco { cursor: pointer; outline: none; transform-origin: 260px 260px; transform-box: view-box; transition: transform .35s ease; }
.arco .cuerpo { fill: rgba(255,255,255,.05); stroke: rgba(255,200,0,.5); stroke-width: 1.2; transition: fill .3s, stroke .3s; }
.arco text { font-family: 'Instrument Serif', Georgia, serif; font-size: 38px; fill: var(--crema);
             text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: fill .3s; }
.arco:hover .cuerpo, .arco:focus-visible .cuerpo { fill: rgba(255,200,0,.18); }
.arco.activo { transform: scale(1.05); }
.arco.activo .cuerpo { fill: url(#oro); stroke: #FFE98A; stroke-width: 1.6; filter: url(#brillo); }
.arco.activo text { fill: #0E1117; }
.hub1 { font-family: 'Inter', sans-serif; font-size: 13px; letter-spacing: .26em; fill: var(--oro); font-weight: 600; text-anchor: middle; }
.hub2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 56px; fill: var(--crema); text-anchor: middle; }
.hub3 { font-family: 'Inter', sans-serif; font-size: 12px; fill: var(--gris); letter-spacing: .06em; text-anchor: middle; }
.hub4 { font-family: 'Inter', sans-serif; font-size: 10px; fill: var(--gris); letter-spacing: .22em; text-anchor: middle; }
@media (prefers-reduced-motion: reduce) { .dial { animation: none; } }
@media (max-width: 820px) { .wrap { flex-direction: column; } .izq { flex: none; width: 100%; } }
</style></head>
<body>
<div class="wrap">
  <div class="izq">
    <svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFE98A"/><stop offset=".5" stop-color="#FFC800"/><stop offset="1" stop-color="#D99A00"/>
        </linearGradient>
        <radialGradient id="hubGrad" cx=".5" cy=".4" r=".7">
          <stop offset="0" stop-color="#1D2330"/><stop offset="1" stop-color="#0B0E14"/>
        </radialGradient>
        <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFC800" flood-opacity=".55"/>
        </filter>
      </defs>
      <g class="dial">
        <circle cx="260" cy="260" r="222" fill="none" stroke="rgba(255,255,255,.10)"/>
        <g id="ticks"></g>
        <circle cx="260" cy="12" r="4.5" fill="#FFC800" filter="url(#brillo)"/>
      </g>
      <g id="arcos"></g>
      <g>
        <circle cx="260" cy="260" r="132" fill="url(#hubGrad)" stroke="rgba(255,200,0,.55)" stroke-width="1.2"/>
        <circle cx="260" cy="260" r="122" fill="none" stroke="rgba(255,255,255,.10)" stroke-dasharray="2 6"/>
        <text x="260" y="205" class="hub1">BAJA ROTACIÓN</text>
        <text x="260" y="224" class="hub1">DE INVENTARIOS</text>
        <line x1="236" y1="240" x2="284" y2="240" stroke="#FFC800" stroke-width="1.5"/>
        <text x="260" y="262" class="hub4">ROTACIÓN ACTUAL</text>
        <text id="hubNum" x="260" y="314" class="hub2">–</text>
        <text id="hubCap" x="260" y="338" class="hub3"></text>
      </g>
    </svg>
  </div>
  <div class="der"><div id="panel"></div></div>
</div>
<script>
const D = __DATOS__;
const C = __CENTRO__;
const NS = "http://www.w3.org/2000/svg";
const CX = 260, CY = 260;
const pt = (r, a) => { const t = a * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; };
const arco = (r1, r2, a0, a1) => {
  const [x0, y0] = pt(r2, a0), [x1, y1] = pt(r2, a1), [x2, y2] = pt(r1, a1), [x3, y3] = pt(r1, a0);
  return `M${x0},${y0} A${r2},${r2} 0 0 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0 0 ${x3},${y3} Z`;
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ticks = '';
for (let i = 0; i < 72; i++) {
  const mayor = i % 6 === 0, a = i * 5;
  const [x0, y0] = pt(226, a), [x1, y1] = pt(226 + (mayor ? 14 : 7), a);
  ticks += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="rgba(255,200,0,${mayor ? .85 : .4})" stroke-width="${mayor ? 1.6 : 1}"/>`;
}
document.getElementById('ticks').innerHTML = ticks;

const gArcos = document.getElementById('arcos');
D.forEach((d, i) => {
  const a0 = -90 + i * 90 + 5, a1 = a0 + 80, am = (a0 + a1) / 2;
  const [tx, ty] = pt(179, am);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'arco');
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  g.setAttribute('aria-label', 'Objetivo ' + d.n + ': ' + d.corto);
  g.innerHTML = `<title>Objetivo ${d.n}: ${esc(d.corto)}</title>
    <path class="cuerpo" d="${arco(150, 208, a0, a1)}"/>
    <text x="${tx}" y="${ty}">0${d.n}</text>`;
  g.addEventListener('click', () => sel(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel(i); } });
  gArcos.appendChild(g);
});

let act = -1;
function sel(i) {
  if (i === act) return;
  act = i;
  document.querySelectorAll('.arco').forEach((g, k) => g.classList.toggle('activo', k === i));
  const d = D[i], p = document.getElementById('panel');
  const fila = (t, v) => `<div class="fila"><small>${t}</small><span>${esc(v)}</span></div>`;
  p.classList.remove('anim'); void p.offsetWidth; p.classList.add('anim');
  p.innerHTML =
    `<div class="kick">Objetivo ${d.n}</div>` +
    `<div class="titulo">${esc(d.corto)}</div>` +
    `<span class="pill ${d.cumple ? 'ok' : 'no'}">${d.cumple ? 'Cumple el estándar' : 'Aún no llega al estándar'}</span>` +
    `<div style="margin-top:10px">${fila('Motivo', d.motivo)}${fila('Causa raíz', d.causa)}${fila('Herramienta', d.herramienta)}${fila('Indicador', d.indicador)}</div>` +
    `<div class="res"><span class="num asis">${esc(d.as_is)}</span><span class="flecha">→</span><span class="num tobe">${esc(d.to_be)}</span><span class="meta">Estándar · ${esc(d.estandar)}</span></div>` +
    `<div class="etq">AS-IS → TO-BE</div>`;
}
document.getElementById('hubNum').textContent = C.actual;
document.getElementById('hubCap').textContent = 'veces/año · referencia ' + C.ref;
sel(0);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') sel((act + 1) % D.length);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') sel((act + D.length - 1) % D.length);
});
</script>
</body></html>
